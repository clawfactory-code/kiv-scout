[package]
name = "kiv-scout"
version = "0.1.0"
edition = "2024"
description = "A local codebase index and MCP context server for quickly navigating large repositories."
license = "MIT"
readme = "README.md"
repository = "https://github.com/elimaine/kiv-scout"
keywords = ["code-search", "mcp", "cli", "tree-sitter", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
